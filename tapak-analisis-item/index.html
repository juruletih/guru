<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapak Analisis Item</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#5b6475;--line:#d9deea;--pri:#2f5bea;--ok:#1e8e4e;--okbg:#e6f6ec;--bad:#c0392b;--badbg:#fdecea;--warn:#fff6dc;--chip:#e9edf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
header{background:#1d2a5b;color:#fff;padding:14px 20px}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:13px;opacity:.85}
main{max-width:1200px;margin:0 auto;padding:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.step{padding:7px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;cursor:pointer;border:0;color:var(--ink)}
.step.on{background:var(--pri);color:#fff}.step.done{background:var(--okbg);color:var(--ok)}
.card{background:var(--card);border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(20,30,60,.08)}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
label{font-weight:600;font-size:13px;display:block;margin:8px 0 4px}
input[type=text],input[type=number],select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:160px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;font-size:14px}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn.ok{background:var(--ok)}.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted);font-size:13px}
.note{background:#eef3ff;border-left:4px solid var(--pri);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.warn{background:var(--warn);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px}
.err{background:var(--badbg);color:var(--bad);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px}
.good{background:var(--okbg);color:var(--ok);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{background:var(--chip)}
td input,td select{width:100%;padding:4px;font-size:12px}
td.num input{width:60px}
td:nth-child(2) select{min-width:54px}td:nth-child(4) select{min-width:96px}td:nth-child(9) select{min-width:104px}td:nth-child(3) input{min-width:64px}

.tbl{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
.conf{display:inline-block;padding:1px 6px;border-radius:999px;font-size:11px;font-weight:700}
.c-hi{background:var(--okbg);color:var(--ok)}.c-md{background:var(--warn);color:#8a6d00}.c-lo{background:var(--badbg);color:var(--bad)}
.lowrow{background:#fffaf0}
.snip{font-size:11px;color:var(--muted);max-width:260px}
.stud{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.stud button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}
.stud button.sel{border-color:var(--pri);background:#eef2ff}.stud button.full{border-color:var(--ok)}
.markgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.markgrid div{background:#fafbff;border:1px solid var(--line);border-radius:8px;padding:6px}
.markgrid select{width:100%;font-size:16px;padding:6px}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Tapak Analisis Item</h1><p>Lampir soalan → semak draf → senarai nama → jana Excel tapak analisis item, atau catat markah terus dalam kelas. Semua diproses dalam pelayar ini; tiada data dihantar keluar.</p></header>
<main>
<div class="steps" id="steps"></div>
<div id="view"></div>
</main>
<script>
"use strict";
/* ============ DATA DSKP (terbina dalam) ============ */
var DSKP = {"KSSM_T1_MT": {"nama": "DSKP KSSM Matematik Tingkatan 1", "bab": [[1, "NOMBOR NISBAH", [["1.1", "Integer", [["1.1.1", "Mengenal nombor positif dan nombor negatif berdasarkan situasi sebenar."], ["1.1.2", "Mengenal dan memerihalkan integer."], ["1.1.3", "Mewakilkan integer pada garis nombor dan membuat perkaitan antara nilai integer dengan kedudukan integer tersebut berbanding integer lain pada garis nombor."], ["1.1.4", "Membanding dan menyusun integer mengikut tertib."]]], ["1.2", "Operasi asas aritmetik yang melibatkan integer", [["1.2.1", "Menambah dan menolak integer menggunakan garis nombor atau kaedah lain yang sesuai."], ["1.2.2", "Mendarab dan membahagi integer menggunakan pelbagai kaedah."], ["1.2.3", "Membuat pengiraan yang melibatkan gabungan operasi asas aritmetik bagi integer mengikut tertib operasi."], ["1.2.4", "Menghuraikan hukum operasi aritmetik iaitu Hukum Identiti, Hukum Kalis Tukar Tertib, Hukum Kalis Sekutuan dan Hukum Kalis Agihan."], ["1.2.5", "Membuat pengiraan yang efisien dengan menggunakan hukum operasi asas aritmetik."], ["1.2.6", "Menyelesaikan masalah yang melibatkan integer."]]], ["1.3", "Pecahan positif dan pecahan negatif", [["1.3.1", "Mewakilkan pecahan positif dan pecahan negatif pada garis nombor."], ["1.3.2", "Membanding dan menyusun pecahan positif dan pecahan negatif mengikut tertib."], ["1.3.3", "Membuat pengiraan yang melibatkan gabungan operasi asas aritmetik bagi pecahan positif dan pecahan negatif mengikut tertib operasi."], ["1.3.4", "Menyelesaikan masalah yang melibatkan pecahan positif dan pecahan negatif."]]], ["1.4", "Perpuluhan positif dan perpuluhan negatif", [["1.4.1", "Mewakilkan perpuluhan positif dan perpuluhan negatif pada garis nombor."], ["1.4.2", "Membanding dan menyusun perpuluhan positif dan perpuluhan negatif mengikut tertib."], ["1.4.3", "Membuat pengiraan yang melibatkan gabungan operasi asas aritmetik bagi perpuluhan positif dan perpuluhan negatif mengikut tertib operasi."], ["1.4.4", "Menyelesaikan masalah yang melibatkan perpuluhan positif dan perpuluhan negatif."]]], ["1.5", "Nombor nisbah", [["1.5.1", "Mengenal dan memerihalkan nombor nisbah."], ["1.5.2", "Membuat pengiraan yang melibatkan gabungan operasi asas aritmetik bagi nombor nisbah mengikut tertib operasi."], ["1.5.3", "Menyelesaikan masalah yang melibatkan nombor nisbah."]]]]], [2, "FAKTOR DAN GANDAAN", [["2.1", "Faktor, faktor perdana dan faktor sepunya terbesar (FSTB)", [["2.1.1", "Menentu dan menyenaraikan faktor bagi nombor bulat, dan seterusnya membuat generalisasi tentang faktor."], ["2.1.2", "Menentu dan menyenaraikan faktor perdana bagi suatu nombor bulat dan seterusnya mengungkapkan nombor tersebut dalam bentuk pemfaktoran perdana."], ["2.1.3", "Menerang dan menentukan faktor sepunya bagi nombor bulat."], ["2.1.4", "Menentukan FSTB bagi dua dan tiga nombor bulat."], ["2.1.5", "Menyelesaikan masalah yang melibatkan FSTB."]]], ["2.2", "Gandaan, gandaan sepunya dan gandaan sepunya terkecil (GSTK)", [["2.2.1", "Menerang dan menentukan gandaan sepunya bagi nombor bulat."], ["2.2.2", "Menentukan GSTK bagi dua dan tiga nombor bulat."], ["2.2.3", "Menyelesaikan masalah yang melibatkan GSTK."]]]]], [3, "KUASA DUA, PUNCA KUASA DUA, KUASA TIGA DAN PUNCA KUASA TIGA", [["3.1", "Kuasa dua dan punca kuasa dua", [["3.1.1", "Menerangkan maksud kuasa dua dan kuasa dua sempurna."], ["3.1.2", "Menentukan sama ada suatu nombor adalah kuasa dua sempurna."], ["3.1.3", "Menyatakan hubungan antara kuasa dua dan punca kuasa dua."], ["3.1.4", "Menentukan kuasa dua suatu nombor tanpa dan dengan menggunakan alat teknologi."], ["3.1.5", "Menentukan punca kuasa dua suatu nombor tanpa menggunakan alat teknologi."], ["3.1.6", "Menentukan punca kuasa dua suatu nombor positif dengan menggunakan alat teknologi."], ["3.1.7", "Menganggar (i) kuasa dua suatu nombor, (ii) punca kuasa dua suatu nombor."], ["3.1.8", "Membuat generalisasi tentang pendaraban yang melibatkan (i) punca kuasa dua nombor yang sama, (ii) punca kuasa dua nombor yang berbeza."], ["3.1.9", "Mengemuka dan menyelesaikan masalah yang melibatkan kuasa dua dan punca kuasa dua."]]], ["3.2", "Kuasa tiga dan punca kuasa tiga", [["3.2.1", "Menerangkan maksud kuasa tiga dan kuasa tiga sempurna."], ["3.2.2", "Menentukan sama ada suatu nombor adalah kuasa tiga sempurna."], ["3.2.3", "Menyatakan hubungan antara kuasa tiga dan punca kuasa tiga."], ["3.2.4", "Menentukan kuasa tiga suatu nombor tanpa dan dengan menggunakan alat teknologi."], ["3.2.5", "Menentukan punca kuasa tiga suatu nombor tanpa menggunakan alat teknologi."], ["3.2.6", "Menentukan punca kuasa tiga suatu nombor dengan menggunakan alat teknologi."], ["3.2.7", "Menganggar (i) kuasa tiga suatu nombor, (ii) punca kuasa tiga suatu nombor."], ["3.2.8", "Menyelesaikan masalah yang melibatkan kuasa tiga dan punca kuasa tiga."], ["3.2.9", "Menjalankan pengiraan yang melibatkan penambahan, penolakan, pendaraban, pembahagian dan gabungan operasi tersebut ke atas kuasa dua, punca kuasa dua, kuasa tiga dan punca kuasa tiga."]]]]], [4, "NISBAH, KADAR DAN KADARAN", [["4.1", "Nisbah", [["4.1.1", "Mewakilkan hubungan antara tiga kuantiti dalam bentuk a : b : c."], ["4.1.2", "Mengenal pasti dan menentukan nisbah setara dalam konteks berangka, geometri atau situasi harian."], ["4.1.3", "Mengungkapkan nisbah dua dan tiga kuantiti dalam bentuk termudah."]]], ["4.2", "Kadar", [["4.2.1", "Menentukan hubungan antara nisbah dan kadar."]]], ["4.3", "Kadaran", [["4.3.1", "Menentukan hubungan antara nisbah dan kadaran."], ["4.3.2", "Menentukan nilai yang tidak diketahui dalam suatu kadaran."]]], ["4.4", "Nisbah, kadar dan kadaran", [["4.4.1", "Menentukan nisbah tiga kuantiti apabila dua atau lebih nisbah dua kuantiti diberi."], ["4.4.2", "Menentukan nisbah atau nilai yang berkaitan apabila diberi (i) nisbah dua kuantiti dan nilai satu kuantiti."], ["4.4.3", "Menentukan nilai yang berkaitan dengan suatu kadar."], ["4.4.4", "Menyelesaikan masalah yang melibatkan nisbah, kadar dan kadaran, termasuk membuat anggaran."]]], ["4.5", "Perkaitan antara nisbah, kadar dan kadaran dengan peratusan, pecahan dan perpuluhan", [["4.5.1", "Menentukan hubungan antara peratusan dan nisbah."], ["4.5.2", "Menentukan peratusan suatu kuantiti dengan mengaplikasikan konsep kadaran."], ["4.5.3", "Menyelesaikan masalah yang melibatkan perkaitan antara nisbah, kadar dan kadaran dengan peratusan, pecahan dan perpuluhan."]]]]], [5, "UNGKAPAN ALGEBRA", [["5.1", "Pemboleh ubah dan ungkapan algebra", [["5.1.1", "Menggunakan huruf untuk mewakilkan kuantiti yang tidak diketahui nilai."], ["5.1.2", "Menerbitkan ungkapan algebra berdasarkan ungkapan aritmetik yang mewakili suatu situasi."], ["5.1.3", "Menentukan nilai ungkapan algebra apabila nilai pemboleh ubah diberi dan membuat perkaitan dengan situasi yang sesuai."], ["5.1.4", "Mengenal pasti sebutan dalam suatu ungkapan algebra."], ["5.1.5", "Mengenal pasti sebutan serupa dan sebutan tidak serupa."]]], ["5.2", "Ungkapan algebra yang melibatkan operasi asas aritmetik", [["5.2.1", "Menambah dan menolak dua atau lebih ungkapan algebra."], ["5.2.2", "Membuat generalisasi tentang pendaraban berulang ungkapan algebra."], ["5.2.3", "Mendarab dan membahagi ungkapan algebra yang mengandungi satu sebutan."]]]]], [6, "PERSAMAAN LINEAR", [["6.1", "Persamaan linear dalam satu pemboleh ubah", [["6.1.1", "Mengenal pasti persamaan linear dalam satu pemboleh ubah dan menghuraikan ciri-ciri persamaan tersebut."], ["6.1.2", "Membentuk persamaan linear dalam satu pemboleh ubah berdasarkan suatu pernyataan atau situasi, dan sebaliknya."], ["6.1.3", "Menyelesaikan persamaan linear dalam satu pemboleh ubah."], ["6.1.4", "Menyelesaikan masalah yang melibatkan persamaan linear dalam satu pemboleh ubah."]]], ["6.2", "Persamaan linear dalam dua pemboleh ubah", [["6.2.1", "Mengenal pasti persamaan linear dalam dua pemboleh ubah dan menghuraikan ciri-ciri persamaan tersebut."], ["6.2.2", "Membentuk persamaan linear dalam dua pemboleh ubah berdasarkan suatu pernyataan atau situasi, dan sebaliknya."], ["6.2.3", "Menentu dan menjelaskan penyelesaian yang mungkin bagi persamaan linear dalam dua pembolehubah."], ["6.2.4", "Mewakilkan persamaan linear dalam dua pemboleh ubah secara graf."]]], ["6.3", "Persamaan linear serentak dalam dua pemboleh ubah", [["6.3.1", "Membentuk persamaan linear serentak berdasarkan situasi harian."], ["6.3.2", "Menyelesaikan persamaan linear serentak dalam dua pemboleh ubah menggunakan pelbagai kaedah."], ["6.3.3", "Menyelesaikan masalah yang melibatkan meneroka dan menyemak jawapan."]]]]], [7, "KETAKSAMAAN LINEAR", [["7.1", "Ketaksamaan", [["7.1.1", "Membanding nilai nombor, memerihal ketaksamaan dan seterusnya menerbitkan ketaksamaan algebra."], ["7.1.2", "Membuat generalisasi tentang ketaksamaan yang berkaitan dengan (i) sifat akas dan transitif, songsangan terhadap penambahan dan pendaraban, (ii) operasi asas aritmetik."]]], ["7.2", "Ketaksamaan linear dalam satu pemboleh ubah", [["7.2.1", "Membentuk ketaksamaan linear berdasarkan suatu situasi kehidupan harian, dan sebaliknya."], ["7.2.2", "Menyelesaikan masalah yang melibatkan ketaksamaan linear dalam satu pemboleh ubah."], ["7.2.3", "Menyelesaikan ketaksamaan linear serentak dalam satu pemboleh ubah."]]]]], [8, "GARIS DAN SUDUT", [["8.1", "Garis dan sudut", [["8.1.1", "Menentu dan menerangkan kekongruenan tembereng garis dan kekongruenan sudut."], ["8.1.2", "Menganggar dan mengukur saiz tembereng garis dan sudut serta menerangkan cara anggaran diperoleh."], ["8.1.3", "Mengenal, membanding beza dan menerangkan sifat sudut pada garis lurus, sudut refleks, dan sudut putaran lengkap."], ["8.1.4", "Memerihalkan sifat sudut pelengkap, sudut penggenap dan sudut konjugat."], ["8.1.5", "Menyelesaikan masalah yang melibatkan sudut pelengkap, sudut penggenap dan sudut konjugat."], ["8.1.6", "Membina (i) tembereng garis, (ii) pembahagi dua sama serenjang suatu tembereng garis, (iii) garis serenjang kepada suatu garis lurus, (iv) garis selari d isi empat", [["9.3.1", "Menghuraikan sifat geometri bagi pelbagai jenis sisi empat."], ["9.3.2", "Membuat dan mengesahkan konjektur tentang hasil tambah sudut pedalaman dan sudut peluaran sisi empat."], ["9.3.3", "Menyelesaikan masalah yang melibatkan sisi empat."], ["9.3.4", "Menyelesaikan masalah yang melibatkan gabungan segi tiga dan sisi empat."]]]]], [10, "PERIMETER DAN LUAS", [["10.1", "Perimeter", [["10.1.1", "Menentukan perimeter pelbagai bentuk apabila panjang sisi diberi atau perlu diukur."], ["10.1.2", "Menganggar perimeter pelbagai bentuk, seterusnya menilai ketepatan anggaran secara membandingkannya dengan nilai yang diukur."], ["10.1.3", "Menyelesaikan masalah yang melibatkan perimeter."]]], ["10.2", "Luas segi tiga, segi empat selari, lelayang dan trapezium", [["10.2.1", "Menganggar luas pelbagai bentuk dengan menggunakan pelbagai kaedah."], ["10.2.2", "Menerbitkan rumus luas segi tiga, segi empat selari, lelayang dan trapezium berdasarkan luas segi empat tepat."], ["10.2.3", "Menyelesaikan masalah yang melibatkan luas segi tiga, segi empat selari, lelayang, trapezium dan gabungan bentuk-bentuk tersebut."]]], ["10.3", "Perkaitan antara perimeter dan luas", [["10.3.1", "Membuat dan mengesahkan konjektur tentang perkaitan antara perimeter dan luas."], ["10.3.2", "Menyelesaikan masalah yang melibatkan perimeter dan luas segi tiga, segi empat tepat, segi empat sama, segi empat selari, lelayang, trapezium dan gabungan bentuk-bentuk tersebut."]]]]], [11, "PENGENALAN SET", [["11.1", "Set", [["11.1.1", "Menerangkan maksud set."], ["11.1.2", "Menghuraikan suatu set dengan menggunakan: (i) perihalan, (ii) penyenaraian, dan (iii) tatatanda pembina set."], ["11.1.3", "Mengenal pasti sama ada suatu objek adalah unsur kepada suatu set dan mewakilkan hubungan tersebut dengan simbol."], ["11.1.4", "Menentukan bilangan unsur bagi suatu set dan mewakilkan bilangan unsur dengan simbol."], ["11.1.5", "Membanding beza dan menerangkan sama ada dua atau lebih set adalah sam       if(!objMode){ var mk0; reMark.lastIndex=0; while((mk0=reMark.exec(L))) push(+mk0[1]); }
      continue;
    }
    if((m=L.match(reSubsub)) && sub){ subsub=m[1]; subsubLine=i; buf.push(m[2]); }
    else if((m=L.match(reSub)) && (!sub || m[1].charCodeAt(0)===sub.charCodeAt(0)+1) && !(subsub && m[1]<=sub)){ sub=m[1]; subsub=""; buf.push(m[2]); }
    else if((m=L.match(reSub))){ buf.push(m[2]); }
    else if(objMode && reOpt.test(L)){ buf.push(L); }
    else buf.push(L);
    var mk; reMark.lastIndex=0;
    while((mk=reMark.exec(L))){ if(!objMode){ if(subsubLine!==i) subsub=""; push(+mk[1]); } }
  }
  if(objMode && q && buf.length) push(1);
  if(!items.length){ var objCount=0; lines.forEach(function(L){ var mm=L.match(/^(\d{1,2})[\.\)]\s+/); if(mm && +mm[1]===objCount+1){objCount++; items.push({bah:"A",no:mm[1],jenis:"Objektif",max:1,bab:"",sk:"",sp:"",aras:"Rendah",conf:0,snip:L.slice(0,200)});} }); }
  return items;
}

/* ============ SEMAKAN ============ */
function checks(){
  var out=[], tot=S.items.reduce(function(a,b){return a+(+b.max||0);},0);
  if(S.meta.jumlah && +S.meta.jumlah!==tot) out.push(["err","Jumlah markah item ("+tot+") tidak sama dengan markah penuh kertas ("+S.meta.jumlah+")."]);
  else if(S.meta.jumlah) out.push(["good","Jumlah markah item sama dengan markah penuh kertas ("+tot+")."]);
  else out.push(["warn","Jumlah markah item: "+tot+". Isi markah penuh kertas untuk semakan."]);
  var seen={}, dup=[]; S.items.forEach(function(it){ var k=it.bah+"|"+it.no; if(seen[k]) dup.push(it.no); seen[k]=1; });
  if(dup.length) out.push(["err","Nombor item berulang: "+dup.join(", ")]);
  var nob=S.items.filter(function(it){return !it.bab;}).length; if(nob) out.push(["warn",nob+" item belum ada bab."]);
  var nom=S.items.filter(function(it){return !(+it.max>0);}).length; if(nom) out.push(["err",nom+" item tiada markah penuh."]);
  var low=S.items.filter(function(it){return it.conf<0.35;}).length; if(low) out.push(["warn",low+" item berkeyakinan rendah (diserlahkan) — semak bab/SP."]);
  return out;
}

/* ============ SENARAI NAMA ============ */
function parseRoster(rows){
  // Sokong: (1) senarai sekolah: baris tajuk kelas "1 AL KHAZINI" diikuti BIL/NAMA; (2) senarai ringkas lajur NAMA.
  var classes={}, curC=null, nameCol=-1;
  rows.forEach(function(r){
    var vals=r.filter(function(v){return v!==null&&v!==undefined&&String(v).trim()!=="";});
    if(!vals.length) return;
    if(vals.length===1 && /^\s*\d\s*[A-Z]/.test(String(vals[0])) ){ curC=String(vals[0]).trim().replace(/\s+/g," "); classes[curC]=[]; nameCol=-1; return; }
    var hi=r.findIndex(function(v){return /^NAMA/i.test(String(v||"").trim());}); if(hi>=0){ nameCol=hi; if(!curC){curC="KELAS"; classes[curC]=classes[curC]||[];} return; }
    if(curC && nameCol>=0 && r[nameCol] && /^\d+\.?0?$/.test(String(r[0]||r[1]||"").trim())){ classes[curC].push(String(r[nameCol]).replace(/\s+/g," ").trim()); }
  });
  Object.keys(classes).forEach(function(k){ if(!classes[k].length) delete classes[k]; });
  return classes;
}

var GRED=[["A+",90],["A",80],["A-",70],["B+",65],["B",60],["C+",55],["C",50],["D",45],["E",40],["G",0]];
function gred(p){ for(var i=0;i<GRED.length;i++) if(p>=GRED[i][1]) return GRED[i][0]; return "G"; }
function gradeFormula(cell){ var f="\"G\""; for(var i=GRED.length-2;i>=0;i--){ f='IF('+cell+'>='+GRED[i][1]+',"'+GRED[i][0]+'",'+f+')'; } return f; }

function colL(n){ var s=""; n++; while(n>0){ var m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }

    var w=XLSX.utils.aoa_to_sheet(aoa); var jc=ic+it.length;
    for(var r=first;r<=last;r++){

    it.forEach(function(x,j){ var c=colL(ic+j), rng=c+first+":"+c+last, hadir='$C$'+first+':$C$'+last;

      w[c+(pr+1)]={t:"s",f:'IF('+c+pr+'="","",IF('+c+pr+'<0.3,"Sukar",IF('+c+pr+'>0.7,"Mudah","Sederhana")))'};

    w["B"+(pr+7)]={t:"s",v:"% lulus (≥40%)"}; w["C"+(pr+7)]={t:"n",f:'IFERROR(ROUND(COUNTIFS($C$'+first+':$C$'+last+',"Y",'+colL(jc+1)+first+':'+colL(jc+1)+last+',">=40")/C'+(pr+5)+'*100,1),"")'};
    // Penguasaan bab
    var babs={}; it.forEach(function(x,j){ var k=x.bab||"?"; (babs[k]=babs[k]||[]).push(j); });
    var br=pr+9; w["B"+br]={t:"s",v:"Penguasaan mengikut bab (%)"}; br++;
    Object.keys(babs).sort(function(a,b){return (+a||99)-(+b||99);}).forEach(function(k){
      var js=babs[k], num=js.map(function(j){var c=colL(ic+j);return 'SUMIF($C$'+first+':$C$'+last+',"Y",'+c+first+':'+c+last+')';}).join("+"), den=js.reduce(function(a,j){return a+(+it[j].max);},0);
      w["B"+br]={t:"s",v:k==="?"?"(Tiada bab)":babName(k)}; w["C"+br]={t:"n",f:'IFERROR(ROUND(('+num+')/(COUNTIF($C$'+first+':$C$'+last+',"Y")*'+den+')*100,1),"")'}; br++;
    });

  '<div class="note">Fail mengandungi helaian <b>TAPAK</b> (item, bab, SK, SP, aras) dan satu helaian bagi setiap kelas dengan formula: jumlah, %, gred, indeks kesukaran p bagi setiap item, % murid menguasai item, min kelas, % lulus dan penguasaan mengikut bab. Isi lajur Hadir dengan T bagi murid tidak hadir.</div>'+
  '<p><button class="btn ok" onclick="download(false)">Muat turun Excel (kosong, untuk diisi)</button> <button class="btn ghost" onclick="go(5)">Atau catat markah dalam kelas →</button></p></div>';
}
function v5(){
  var cls=Object.keys(S.classes); if(!cls.length) return '<div class="card"><div class="err">Tambah senarai nama dahulu (Langkah 3).</div></div>';
  if(!S.curClass || !S.classes[S.curClass]) S.curClass=cls[0];
  var names=S.classes[S.curClass]; var M=(S.marks[S.curClass]=S.marks[S.curClass]||names.map(function(){return S.items.map(function(){return "";});}));
  var i=Math.min(S.curStudent,names.length-1);
  var studs=names.map(function(n,k){ var full=M[k]&&M[k].every(function(v){return v!=="";}); return '<button class="'+(k===i?"sel ":"")+(full?"full":"")+'" onclick="pickS('+k+')">'+(k+1)+'. '+esc(n.slice(0,26))+'</button>'; }).join("");
  var grid=S.items.map(function(x,j){ var o=['<option value="">–</option>']; for(var m=0;m<=+x.max;m++) o.push('<option value="'+m+'"'+(String(M[i][j])===String(m)?" selected":"")+'>'+m+'</option>'); return '<div><div class="muted">'+esc(x.bah+" "+x.no)+' /'+x.max+'</div><select data-j="'+j+'">'+o.join("")+'</select></div>'; }).join("");
  var tot=S.items.reduce(function(a,b){return a+(+b.max||0);},0), sum=M[i].reduce(function(a,v){return a+(+v||0);},0);
  var stats=S.items.map(function(x,j){ var vals=M.map(function(r){return r[j];}).filter(function(v){return v!=="";}); var p=vals.length?vals.reduce(function(a,v){return a+(+v);},0)/(vals.length*x.max):null; return '<span class="pill">'+esc(x.no)+': '+(p===null?"–":p.toFixed(2))+'</span>'; }).join("");
  return '<div class="card"><h2>5. Catat markah dalam kelas</h2><div class="row"><div><label>Kelas</label><select onchange="S.curClass=this.value;S.curStudent=0;save();render()">'+opt(cls,S.curClass)+'</select></div></div>'+
  '<h3>Murid</h3><div class="stud">'+studs+'</div>'+
  '<h3>'+(i+1)+'. '+esc(names[i])+' — jumlah '+sum+'/'+tot+' ('+(tot?Math.round(sum/tot*100):0)+'%, '+gred(tot?sum/tot*100:0)+')</h3><div class="markgrid" id="mg">'+grid+'</div>'+
  '<p><button class="btn ghost" onclick="pickS('+Math.max(0,i-1)+')">← Murid sebelum</button> <button class="btn" onclick="pickS('+Math.min(names.length-1,i+1)+')">Murid seterusnya →</button></p>'+
  '<h3>Indeks kesukaran semasa (p)</h3><div>'+stats+'</div>'+
  '<p><button class="btn ok" onclick="download(true)">Muat turun Excel dengan markah</button></p><div class="muted">Markah disimpan automatik dalam pelayar ini.</div></div>';
}
function pickS(k){ S.curStudent=k; save(); render(); }
function bind5(){ var mg=document.getElementById("mg"); if(!mg) return; mg.querySelectorAll("select").forEach(function(s){ s.onchange=function(){ var j=+s.dataset.j; S.marks[S.curClass][Math.min(S.curStudent,S.classes[S.curClass].length-1)][j]=s.value; save(); render(); }; }); }

/* ============ MULA ============ */
try{ Object.assign(DSKP, JSON.parse(localStorage.getItem(KEY+"_dskp")||"{}")); }catch(e){}
load(); render();
</script>
